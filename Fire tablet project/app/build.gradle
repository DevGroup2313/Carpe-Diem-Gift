apply plugin: 'com.android.application'
android {
    namespace 'com.yannie.carpediem'
    compileSdk 34
    defaultConfig {
        applicationId 'com.yannie.carpediem'
        minSdk 22
        targetSdk 34
        // The version number rises by itself with every build: it is the
        // number of minutes since 1 January 2025. Android refuses to install
        // an older number over a newer one, so a fixed number would block
        // updates, and this one never goes backwards, whichever repository
        // or computer builds it.
        versionCode ((int) ((System.currentTimeMillis() - 1735689600000L) / 60000L))
        versionName '1079'

        // Build 1046: the tablet's writing model (llama.cpp), built for 64-bit
        // ARM tablets; 32-bit tablets get a small placeholder so the app still
        // installs there (see src/main/cpp/CMakeLists.txt)
        externalNativeBuild {
            cmake {
                arguments '-DCMAKE_BUILD_TYPE=Release', '-DANDROID_STL=c++_shared', '-DANDROID_PLATFORM=android-24'
            }
        }
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // ONE PERMANENT KEY. A debug build is signed with a key made fresh on
    // each build machine, so every GitHub build had a different signature and
    // Android refused to install it over the last one ("App not installed").
    // The only way past that was to uninstall, which deletes everything saved
    // in the app. Every build is now signed with this one key, kept in the
    // project, so a new APK installs over the old one and your work stays.
    // Keep carpe-diem.keystore with the project. If it is ever lost, the next
    // build must be installed fresh (export a backup first).
    signingConfigs {
        carpe {
            storeFile file('carpe-diem.keystore')
            storePassword 'carpediem'
            keyAlias 'carpediem'
            keyPassword 'carpediem'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.carpe }
        release {
            minifyEnabled false
            signingConfig signingConfigs.carpe
        }
    }

    // Stated outright rather than left to a default. Without this the plugin
    // compiles for Java 8 and warns, and on some toolchains the warning is
    // promoted to an error.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Build 1046: the native build of the tablet's writing model, with the
    // toolchain Inkwell's model was built and tested with
    ndkVersion '26.1.10909125'
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    // the engine finds its processor variants as files in the app's native
    // library folder, so the libraries are unpacked on install
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    // A lint complaint must never be the reason there is no app to install.
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
dependencies { implementation 'androidx.webkit:webkit:1.8.0' }
