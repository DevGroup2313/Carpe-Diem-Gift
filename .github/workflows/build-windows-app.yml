#
# Builds Carpe Diem for Windows on GitHub's own Windows computer, so nothing has
# to be installed or built on your PC. It runs by itself whenever something is
# uploaded to the repository, and by hand from the Actions tab ("Build Carpe
# Diem for Windows", "Run workflow"). Two downloads are placed on the Releases
# page and under "Artifacts" on the run's page:
#   Carpe-Diem-<build>-Windows-Setup.exe  the installer, made the way Inkwell's
#       is: Carpe Diem as a folder, installed for you only (no administrator),
#       with Start menu and Desktop shortcuts and an uninstaller. It should open
#       sooner than the single file, because nothing is unpacked at each start.
#   Carpe-Diem-Windows.zip  the portable single Carpe Diem.exe, for a USB stick.
# Both use the same folder for your work, %LOCALAPPDATA%\CarpeDiem\storage.

name: Build Carpe Diem for Windows

on:
  push:
    # the gift editions have their own workflow; a push that changes only them
    # leaves this app as it is, so it is not built again
    paths-ignore:
      - 'Gift editions/**'
      - '.github/workflows/build-*-gifts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Get the project
        uses: actions/checkout@v5

      - name: Find the project folder
        run: |
          $f = Get-ChildItem -Path 'Windows project' -Recurse -Filter carpe_diem.spec | Where-Object { $_.FullName -notmatch '\\.git\\' } | Select-Object -First 1
          if (-not $f) { Write-Error "carpe_diem.spec not found. Upload the CONTENTS of the Windows project folder."; exit 1 }
          "PROJ=$($f.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Project folder: $($f.DirectoryName)"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the build tools
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pyinstaller pywebview pythonnet
          python -m pip list | Select-String -Pattern "pyinstaller|pywebview|pythonnet"

      - name: Read the clipboard as the app's Paste does
        # build 1048: the page's right-click Paste asks the app for the clipboard, so a link
        # copied anywhere in Windows can be pasted without the keyboard. Checked on real Windows.
        run: |
          Set-Location $env:PROJ
          Set-Clipboard -Value 'Carpe 1048, copied outside the app: https://example.org/x'
          python -c "import carpe_diem_app as a; r = a.read_clipboard(); print(r); assert 'copied outside the app' in r['text']"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build Carpe Diem.exe
        run: |
          Set-Location $env:PROJ
          python -m PyInstaller --noconfirm --clean carpe_diem.spec 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\build-log.txt"
          if (-not (Test-Path "dist\Carpe Diem.exe")) { Write-Error "No exe was produced."; exit 1 }
          Get-Item "dist\Carpe Diem.exe" | Format-List Name, Length

      - name: If the build failed, show why
        if: failure()
        run: Get-Content "$env:RUNNER_TEMP\build-log.txt" -Tail 80

      - name: Open the app once
        # Starts the finished exe for 30 seconds and reads its own log.
        run: |
          Set-Location "$env:PROJ\dist"
          Remove-Item carpe_diem_crash.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath ".\Carpe Diem.exe" -PassThru
          Start-Sleep -Seconds 30
          try {
            New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\shots" | Out-Null
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$env:RUNNER_TEMP\shots\windows.png")
            "Screenshot taken."
          } catch { "No screenshot: $($_.Exception.Message)" }
          $alive = -not $p.HasExited
          if ($alive) { "Still running after 30 seconds." } else { "EXITED EARLY with code $($p.ExitCode)" }
          # the single file starts a second process of the same name: every Carpe Diem process is stopped, so the
          # next step does not find a copy already open (build 1063 opens one copy at a time)
          Get-Process -Name 'Carpe Diem' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          "--- what the app recorded ---"
          if (Test-Path carpe_diem_crash.log) { Get-Content carpe_diem_crash.log } else { "(nothing)" }
          if ((Test-Path carpe_diem_crash.log) -and (Select-String -Path carpe_diem_crash.log -Pattern "Traceback" -Quiet)) { Write-Error "A fault was recorded."; exit 1 }
          if (-not $alive) { exit 1 }
          Remove-Item carpe_diem_crash.log -ErrorAction SilentlyContinue

      - name: Keep the screenshot with this run
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-screenshot
          path: ${{ runner.temp }}/shots
          if-no-files-found: warn

      - name: Check the app file inside is the one committed
        run: |
          python -c "import hashlib,sys; from PyInstaller.archive.readers import CArchiveReader as R; d=R(r'$env:PROJ\dist\Carpe Diem.exe').extract('carpe_diem.html'); s=open(r'$env:PROJ\carpe_diem.html','rb').read(); print('inside', hashlib.md5(d).hexdigest(), 'committed', hashlib.md5(s).hexdigest(), 'CRLF inside', d.count(b'\r\n')); sys.exit(0 if d==s and d.count(b'\r\n')==0 else 1)"

      - name: Build the installed version (a folder, as Inkwell's)
        run: |
          Set-Location $env:PROJ
          python -m PyInstaller --noconfirm --clean --distpath dist_installed carpe_diem_onedir.spec 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\build-onedir-log.txt"
          if (-not (Test-Path "dist_installed\Carpe Diem\Carpe Diem.exe")) { Get-Content "$env:RUNNER_TEMP\build-onedir-log.txt" -Tail 60; Write-Error "No folder build was produced."; exit 1 }
          Get-ChildItem "dist_installed\Carpe Diem" | Format-Table Name, Length

      - name: Open the folder version once
        run: |
          Set-Location "$env:PROJ\dist_installed\Carpe Diem"
          Remove-Item carpe_diem_crash.log -ErrorAction SilentlyContinue
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath ".\Carpe Diem.exe" -PassThru
          Start-Sleep -Seconds 25
          $alive = -not $p.HasExited
          if ($alive) { "Still running after 25 seconds." } else { "EXITED EARLY with code $($p.ExitCode)" }
          Get-Process -Name 'Carpe Diem' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          "--- what the app recorded ---"
          if (Test-Path carpe_diem_crash.log) { Get-Content carpe_diem_crash.log } else { "(nothing)" }
          if ((Test-Path carpe_diem_crash.log) -and (Select-String -Path carpe_diem_crash.log -Pattern "Traceback" -Quiet)) { Write-Error "A fault was recorded."; exit 1 }
          if (-not $alive) { exit 1 }
          Remove-Item carpe_diem_crash.log -ErrorAction SilentlyContinue

      - name: Make the installer
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { Write-Error "Inno Setup could not be found or installed."; exit 1 }
          $pass = ((Select-String -Path "$env:PROJ\BUILD_INFO.txt" -Pattern '^Pass:').Line -replace '[^0-9]', '')
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\out" | Out-Null
          & $iscc /Qp "/DAppVersion=$pass" "/DSourceDir=$env:PROJ\dist_installed\Carpe Diem" "/DOutputDir=$env:GITHUB_WORKSPACE\out" "$env:PROJ\build\carpe_diem.iss"
          $setup = "Carpe-Diem-$pass-Windows-Setup.exe"
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\out\$setup")) { Write-Error "No installer was made."; exit 1 }
          "SETUP_NAME=$setup" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Item "$env:GITHUB_WORKSPACE\out\$setup" | Format-List Name, Length

      - name: Install, open, and uninstall it, as a person would
        run: |
          Get-Process -Name 'Carpe Diem' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $setup = "$env:GITHUB_WORKSPACE\out\$env:SETUP_NAME"
          $app = Join-Path $env:LOCALAPPDATA "Programs\Carpe Diem"
          $store = Join-Path $env:LOCALAPPDATA "CarpeDiem\storage"
          New-Item -ItemType Directory -Force -Path $store | Out-Null
          Set-Content -Path (Join-Path $store "keep-me.txt") -Value "work that must survive"
          $i = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=desktopicon' -PassThru -Wait
          "installer exit code: $($i.ExitCode)"
          if (-not (Test-Path "$app\Carpe Diem.exe")) { Write-Error "The installer did not put Carpe Diem.exe in $app"; exit 1 }
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) "Carpe Diem.lnk"
          "Start menu shortcut: $(Test-Path $lnk)"
          "Desktop shortcut: $(Test-Path (Join-Path ([Environment]::GetFolderPath('Desktop')) 'Carpe Diem.lnk'))"
          $bk = Get-ChildItem (Join-Path $env:LOCALAPPDATA "CarpeDiem\backups") -Directory -ErrorAction SilentlyContinue
          "safety copies before install: $(@($bk).Count)"
          # build 1063: the five rooms in the Start menu, each opening in a window of its own
          foreach ($r in 'Tabula','Abacus','Imago','Scriba','Fontes') {
            $rl = Join-Path ([Environment]::GetFolderPath('Programs')) "$r.lnk"
            if (-not (Test-Path $rl)) { Write-Error "The Start menu has no shortcut for $r"; exit 1 }
          }
          "Start menu: Carpe Diem and its five rooms."
          $p = Start-Process -FilePath "$app\Carpe Diem.exe" -PassThru
          Start-Sleep -Seconds 25
          $alive = -not $p.HasExited
          if (-not $alive) { "EXITED EARLY with code $($p.ExitCode)"; if (Test-Path "$app\carpe_diem_crash.log") { Get-Content "$app\carpe_diem_crash.log" }; exit 1 }
          "The installed Carpe Diem is running."
          # build 1065: on Windows the window reads its page from the installed file (no address serves it, so no
          # cache of an address can hold an earlier build); the installed page is this build's, and the program noted
          # this build's first start, when it empties the web view's cache of pages
          $want = ((Select-String -Path "$env:PROJ\BUILD_INFO.txt" -Pattern '^Pass:').Line -replace '[^0-9]', '')
          $page = Get-ChildItem -Path $app -Recurse -Filter 'carpe_diem.html' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $page) { Write-Error "The installed program has no page."; exit 1 }
          if (-not (Select-String -Path $page.FullName -Pattern ('pass:"' + $want + '"') -SimpleMatch -Quiet)) { Write-Error "The installed page is not build $want."; exit 1 }
          $noted = Get-Content (Join-Path $env:LOCALAPPDATA "CarpeDiem\page_build.txt") -ErrorAction SilentlyContinue
          "The build the program noted: $noted"
          if ("$noted" -notmatch ('^' + $want + ' ')) { Write-Error "The program did not note build $want's first start."; exit 1 }
          "The installed page is build $want, read from the installed file."
          # one copy at a time: a second start, here asking for Tabula, hands the room to the open copy and ends at once
          $q = Start-Process -FilePath "$app\Carpe Diem.exe" -ArgumentList '--room','tabula' -PassThru
          if (-not $q.WaitForExit(40000)) { Stop-Process -Id $q.Id -Force; Write-Error "A second start did not end: two copies would be open."; exit 1 }
          $n = @(Get-Process -Name 'Carpe Diem' -ErrorAction SilentlyContinue).Count
          "Copies of Carpe Diem running after a second start: $n"
          if ($n -ne 1) { Write-Error "Expected one copy of Carpe Diem, found $n."; exit 1 }
          $seen = $false
          for ($k = 0; $k -lt 40 -and -not $seen; $k++) { Start-Sleep -Seconds 1; $seen = [bool](Select-String -Path "$app\carpe_diem_crash.log" -Pattern "room tabula asked by a shortcut" -Quiet -ErrorAction SilentlyContinue) }
          "Room request left for the open copy: $(Test-Path (Join-Path $env:LOCALAPPDATA 'CarpeDiem\open-room.txt')) (it is taken away once read)"
          if (Test-Path "$app\carpe_diem_crash.log") { Get-Content "$app\carpe_diem_crash.log" | Select-String -Pattern "room|copy|care|windows" | ForEach-Object { $_.Line } } else { "(no record beside the program)" }
          if (-not (Select-String -Path "$app\carpe_diem_crash.log" -Pattern "room tabula asked by a shortcut: opened" -Quiet -ErrorAction SilentlyContinue)) { "--- the program's record ---"; Get-Content "$app\carpe_diem_crash.log" -ErrorAction SilentlyContinue | Select-Object -Last 60; Write-Error "Tabula's shortcut did not open its window in the open copy."; exit 1 }
          "Tabula's shortcut opened Tabula's window in the open copy."
          # build 1065: a newer build started while an older one is open takes its place, and does not merely bring the
          # older one forward (a portable copy can be started beside an installed one); the build noted as open is made
          # an older one here
          $first = @(Get-Process -Name 'Carpe Diem' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Id)
          Set-Content -Path (Join-Path $env:LOCALAPPDATA "CarpeDiem\page_build.txt") -Value "1000 0" -NoNewline
          $z = Start-Process -FilePath "$app\Carpe Diem.exe" -PassThru
          Start-Sleep -Seconds 30
          $now = @(Get-Process -Name 'Carpe Diem' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Id)
          "Open before: $($first -join ', '); open after: $($now -join ', '); the newer start: $($z.Id)"
          if ($z.HasExited) { Write-Error "The newer start ended instead of taking the older one's place."; exit 1 }
          foreach ($f in $first) { if ($now -contains $f) { Write-Error "The older copy ($f) is still open."; exit 1 } }
          Get-Content "$app\carpe_diem_crash.log" | Select-String -Pattern "another build|other build" | ForEach-Object { $_.Line }
          if (-not (Select-String -Path "$app\carpe_diem_crash.log" -Pattern "the other build has closed" -SimpleMatch -Quiet)) { Write-Error "The record does not say the older copy closed."; exit 1 }
          "A newer build took the older one's place."
          Stop-Process -Name 'Carpe Diem' -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          $u = Start-Process -FilePath "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          # the uninstaller hands its work to a copy of itself, so wait until the program is gone
          for ($k = 0; $k -lt 60 -and (Test-Path "$app\Carpe Diem.exe"); $k++) { Start-Sleep -Seconds 1 }
          "uninstaller exit code: $($u.ExitCode)"
          if (Test-Path "$app\Carpe Diem.exe") { Write-Error "Uninstalling left the program behind."; exit 1 }
          if (-not (Test-Path (Join-Path $store "keep-me.txt"))) { Write-Error "Uninstalling touched the work folder."; exit 1 }
          "Uninstalled cleanly; the work folder is untouched."

      - name: Keep the installer with this run
        uses: actions/upload-artifact@v6
        with:
          name: carpe-diem-windows-setup
          path: out/${{ env.SETUP_NAME }}
          if-no-files-found: error

      - name: Pack the app
        run: |
          Compress-Archive -Path "$env:PROJ\dist\Carpe Diem.exe" -DestinationPath "$env:GITHUB_WORKSPACE\Carpe-Diem-Windows.zip" -Force
          Get-Item "$env:GITHUB_WORKSPACE\Carpe-Diem-Windows.zip" | Format-List Name, Length

      - name: Keep the app with this run
        uses: actions/upload-artifact@v6
        with:
          name: carpe-diem-windows
          path: Carpe-Diem-Windows.zip
          if-no-files-found: error

      - name: Put the app on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "carpe-diem-windows"
          $pass = ((Select-String -Path "$env:PROJ\BUILD_INFO.txt" -Pattern '^Pass:').Line -replace '[^0-9]', '')
          $notes = "Carpe Diem for Windows, build $pass. Built $((Get-Date).ToUniversalTime().ToString('dd MMMM yyyy, HH:mm')) UTC from branch $env:GITHUB_REF_NAME, commit $($env:GITHUB_SHA.Substring(0,7)). RECOMMENDED: download $env:SETUP_NAME and open it. It installs Carpe Diem for you only, with no administrator password, adds it to the Start menu (and the Desktop if you tick it), and should open sooner than the single file, because nothing is unpacked at each start. Python is not needed. If Windows SmartScreen says it protected your PC, choose More info, then Run anyway (the installer is not signed with a paid certificate). To remove it: Settings, Apps, Carpe Diem, Uninstall; your work stays. For a USB stick instead: Carpe-Diem-Windows.zip holds the portable Carpe Diem.exe. Both open the same work."
          # build 1063: the same installer under a name that never changes, so a saved link always gives the newest
          Copy-Item "out/$env:SETUP_NAME" "out/carpe-diem-windows-setup.exe" -Force
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag Carpe-Diem-Windows.zip "out/$env:SETUP_NAME" "out/carpe-diem-windows-setup.exe" --clobber
            gh release edit $tag --notes $notes
            # only this build's installer stays on the page, so there is one file to choose
            $names = gh release view $tag --json assets -q '.assets[].name'
            foreach ($n in $names) {
              if ($n -like 'Carpe-Diem-*-Windows-Setup.exe' -and $n -ne $env:SETUP_NAME) { gh release delete-asset $tag $n --yes }
            }
            $global:LASTEXITCODE = 0   # tidying the page never fails the build
          } else {
            gh release create $tag Carpe-Diem-Windows.zip "out/$env:SETUP_NAME" "out/carpe-diem-windows-setup.exe" --target $env:GITHUB_SHA --title "Carpe Diem for Windows" --notes $notes
          }
